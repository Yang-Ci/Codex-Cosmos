[package]
name = "codex-cosmos"
version = "1.2.2"
description = "A cross-platform cosmic desktop companion for Codex quota, weather, focus and file utilities"
authors = ["Yang-Ci"]
edition = "2021"

[lib]
name = "codex_cosmos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "codex-cosmos"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
arboard = { version = "3.6.1", default-features = false }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls", "gzip"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
sha2 = "0.10"
hex = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
trash = "5.2.6"
walkdir = "2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# 星际通讯站 (Cosmos Relay) — 局域网投递，兼容 LocalSend v2.2 协议
axum = { version = "0.7", default-features = false, features = ["json", "tokio", "http1", "query"] }
futures = "0.3"
if-addrs = "0.7"
socket2 = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging"
] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
